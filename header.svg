<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="800" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.45" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#fffbeb"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f59e0b"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font: 900 120px 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif; letter-spacing: 22px; }
    .sub   { font: 600 18px 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif; fill: #ccfbf1; letter-spacing: 1px; }
    .tag   { font: italic 500 17px 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif; fill: #fde68a; opacity: 0;
             animation: fade 9s infinite; }
    .t2 { animation-delay: 3s; }
    .t3 { animation-delay: 6s; }
    @keyframes fade { 0% {opacity:0} 5% {opacity:1} 30% {opacity:1} 36% {opacity:0} 100% {opacity:0} }

    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 3s ease-in-out infinite; }
    .b2 { animation-delay: .4s; } .b3 { animation-delay: .8s; } .b4 { animation-delay: 1.2s; } .b5 { animation-delay: 1.6s; }
    @keyframes grow { 0%,100% {transform: scaleY(.35)} 50% {transform: scaleY(1)} }

    .line { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 4s ease-in-out infinite; }
    .arrow { opacity: 0; animation: show 4s ease-in-out infinite; }
    @keyframes draw { 0% {stroke-dashoffset:420} 60%,100% {stroke-dashoffset:0} }
    @keyframes show { 0%,55% {opacity:0} 65%,100% {opacity:1} }

    .coin { opacity: 0; animation: rise 6s linear infinite; }
    .c2 { animation-delay: 1.2s; } .c3 { animation-delay: 2.4s; } .c4 { animation-delay: 3.6s; } .c5 { animation-delay: 4.8s; }
    @keyframes rise { 0% {transform: translateY(0); opacity:0} 12% {opacity:.95} 85% {opacity:.6} 100% {transform: translateY(-300px); opacity:0} }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {transform: scale(.9); opacity:.7} 50% {transform: scale(1.1); opacity:1} }
  </style>

  <rect width="1000" height="320" rx="18" fill="url(#bg)"/>

  <g stroke="#5eead4" stroke-opacity="0.08">
    <line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <g class="coin c1" transform="translate(120 340)"><circle r="15" fill="#facc15" stroke="#b45309" stroke-width="2"/><text y="4" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="700" fill="#78350f">Rp</text></g>
  <g class="coin c2" transform="translate(330 340)"><circle r="11" fill="#facc15" stroke="#b45309" stroke-width="2"/><text y="3" text-anchor="middle" font-family="Verdana" font-size="8" font-weight="700" fill="#78350f">Rp</text></g>
  <g class="coin c3" transform="translate(690 340)"><circle r="14" fill="#facc15" stroke="#b45309" stroke-width="2"/><text y="4" text-anchor="middle" font-family="Verdana" font-size="10" font-weight="700" fill="#78350f">Rp</text></g>
  <g class="coin c4" transform="translate(880 340)"><circle r="12" fill="#facc15" stroke="#b45309" stroke-width="2"/><text y="3" text-anchor="middle" font-family="Verdana" font-size="9" font-weight="700" fill="#78350f">Rp</text></g>
  <g class="coin c5" transform="translate(520 340)"><circle r="10" fill="#facc15" stroke="#b45309" stroke-width="2"/><text y="3" text-anchor="middle" font-family="Verdana" font-size="7" font-weight="700" fill="#78350f">Rp</text></g>

  <g>
    <rect class="bar b1" x="45"  y="190" width="22" height="90"  rx="4" fill="#2dd4bf"/>
    <rect class="bar b2" x="77"  y="160" width="22" height="120" rx="4" fill="#5eead4"/>
    <rect class="bar b3" x="109" y="200" width="22" height="80"  rx="4" fill="#2dd4bf"/>
    <rect class="bar b4" x="141" y="140" width="22" height="140" rx="4" fill="#facc15"/>
    <rect class="bar b5" x="173" y="120" width="22" height="160" rx="4" fill="#fbbf24"/>
    <line x1="35" y1="281" x2="205" y2="281" stroke="#ccfbf1" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <g>
    <polyline class="line" points="790,260 830,230 860,245 900,190 930,200 965,130" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon class="arrow" points="965,112 978,140 952,138" fill="#facc15"/>
    <line x1="780" y1="281" x2="975" y2="281" stroke="#ccfbf1" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <ellipse class="pulse" cx="500" cy="125" rx="260" ry="80" fill="url(#glow)"/>

  <text class="title" x="511" y="165" text-anchor="middle" fill="#000" fill-opacity="0.25">MARIE</text>
  <text class="title" x="506" y="160" text-anchor="middle" fill="url(#gold)">MARIE</text>

  <text class="sub" x="500" y="205" text-anchor="middle">Money Allocation · Regulation · Insight · Evaluation</text>

  <text class="tag t1" x="500" y="245" text-anchor="middle">Kelola uangmu dengan lebih teratur</text>
  <text class="tag t2" x="500" y="245" text-anchor="middle">Bagi pemasukan ke pocket sesuai tujuan</text>
  <text class="tag t3" x="500" y="245" text-anchor="middle">Dapatkan saran keuangan dari literatur</text>
</svg>
